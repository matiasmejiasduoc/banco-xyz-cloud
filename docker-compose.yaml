name: banco-xyz

x-servicio: &servicio
  restart: unless-stopped
  networks:
    - banco
  deploy:
    resources:
      limits:
        memory: 512m

x-seguridad: &seguridad
  AUTH_ISSUER: http://auth-server:9100
  AUTH_URL: http://auth-server:9100

x-base-datos: &base-datos
  DB_USUARIO: ${POSTGRES_USUARIO:-banco}
  DB_CLAVE: ${POSTGRES_CLAVE:-banco-clave}
  DDL_AUTO: update

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USUARIO:-banco}
      POSTGRES_PASSWORD: ${POSTGRES_CLAVE:-banco-clave}
      POSTGRES_DB: banco
    volumes:
      - datos-postgres:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d banco"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - banco

  kafka:
    image: apache/kafka:4.1.0
    restart: unless-stopped
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNO://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNO://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNO:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s
    networks:
      - banco

  kafka-ui:
    image: kafbat/kafka-ui:v1.3.0
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: banco-xyz
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - banco

  auth-server:
    <<: *servicio
    build:
      context: .
      dockerfile: auth-server/Dockerfile
    image: banco-xyz/auth-server:1.0.0
    ports:
      - "9100:9100"
    environment:
      AUTH_ISSUER: http://auth-server:9100
      CLIENTE_DEMO_CLAVE: ${CLIENTE_DEMO_CLAVE:-cliente123}
      PORTAL_WEB_SECRET: ${PORTAL_WEB_SECRET:-portal-web-secret}
      APP_MOVIL_SECRET: ${APP_MOVIL_SECRET:-app-movil-secret}
      CAJERO_CAJ001_SECRET: ${CAJERO_CAJ001_SECRET:-caj-001-secret}
      CAJERO_CAJ002_SECRET: ${CAJERO_CAJ002_SECRET:-caj-002-secret}
      BFF_WEB_SECRET: ${BFF_WEB_SECRET:-bff-web-secret}
      BFF_MOVIL_SECRET: ${BFF_MOVIL_SECRET:-bff-movil-secret}
      BFF_CAJERO_SECRET: ${BFF_CAJERO_SECRET:-bff-cajero-secret}

  cuentas-service:
    <<: *servicio
    build:
      context: .
      dockerfile: servicios/cuentas-service/Dockerfile
    image: banco-xyz/cuentas-service:1.0.0
    ports:
      - "8081:8081"
    environment:
      <<: [*seguridad, *base-datos]
      DB_URL: jdbc:postgresql://postgres:5432/cuentas
    depends_on:
      postgres:
        condition: service_healthy
      auth-server:
        condition: service_healthy

  transacciones-service:
    <<: *servicio
    build:
      context: .
      dockerfile: servicios/transacciones-service/Dockerfile
    image: banco-xyz/transacciones-service:1.0.0
    ports:
      - "8082:8082"
    environment:
      <<: [*seguridad, *base-datos]
      DB_URL: jdbc:postgresql://postgres:5432/transacciones
    depends_on:
      postgres:
        condition: service_healthy
      auth-server:
        condition: service_healthy

  movimientos-service:
    <<: *servicio
    build:
      context: .
      dockerfile: servicios/movimientos-service/Dockerfile
    image: banco-xyz/movimientos-service:1.0.0
    ports:
      - "8083:8083"
    environment:
      <<: [*seguridad, *base-datos]
      DB_URL: jdbc:postgresql://postgres:5432/movimientos
      KAFKA_SERVIDORES: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      auth-server:
        condition: service_healthy

  bff-web:
    <<: *servicio
    build:
      context: .
      dockerfile: bff/bff-web/Dockerfile
    image: banco-xyz/bff-web:1.0.0
    ports:
      - "8090:8090"
    environment:
      <<: *seguridad
      BFF_WEB_SECRET: ${BFF_WEB_SECRET:-bff-web-secret}
      CUENTAS_URL: http://cuentas-service:8081
      MOVIMIENTOS_URL: http://movimientos-service:8083
      TRANSACCIONES_URL: http://transacciones-service:8082
    depends_on:
      cuentas-service:
        condition: service_healthy
      movimientos-service:
        condition: service_healthy
      transacciones-service:
        condition: service_healthy

  bff-movil:
    <<: *servicio
    build:
      context: .
      dockerfile: bff/bff-movil/Dockerfile
    image: banco-xyz/bff-movil:1.0.0
    ports:
      - "8091:8091"
    environment:
      <<: *seguridad
      BFF_MOVIL_SECRET: ${BFF_MOVIL_SECRET:-bff-movil-secret}
      CUENTAS_URL: http://cuentas-service:8081
      MOVIMIENTOS_URL: http://movimientos-service:8083
    depends_on:
      cuentas-service:
        condition: service_healthy
      movimientos-service:
        condition: service_healthy

  bff-cajero:
    <<: *servicio
    build:
      context: .
      dockerfile: bff/bff-cajero/Dockerfile
    image: banco-xyz/bff-cajero:1.0.0
    ports:
      - "8092:8092"
    environment:
      <<: *seguridad
      BFF_CAJERO_SECRET: ${BFF_CAJERO_SECRET:-bff-cajero-secret}
      CUENTAS_URL: http://cuentas-service:8081
      KAFKA_SERVIDORES: kafka:9092
    depends_on:
      cuentas-service:
        condition: service_healthy
      kafka:
        condition: service_healthy

networks:
  banco:
    name: banco-xyz

volumes:
  datos-postgres:
